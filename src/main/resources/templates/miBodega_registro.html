<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiBodega</title>

        
        <script src="/js/redireccion_jwt.js" type="text/javascript"></script>
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Referencia a los css -->
        <link href="/css/plantillaMiBodega.css" rel="stylesheet" type="text/css"/>
        <link href="/css/miBodega_registro.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        <!-- Header -->
        <header class="header">
            <!-- Botón hamburguesa -->
            <button class="btn" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-3"></i>
            </button>
            <div>
                <!-- Variables dinámicas con Thymeleaf para la fecha y la hora -->
                <span class="text-primary" id="fecha" th:text="${fecha}">FECHA: 27/09/25</span>
                <span class="ms-3 text-primary" id="hora" th:text="${hora}">HORA: 9:00</span>
            </div>
        </header>

        <!-- Sidebar Offcanvas -->
        <aside class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebar">
            <div class="offcanvas-header">
                <!-- Logo con Thymeleaf para las imágenes  -->
                <img th:src="@{/SVG/LogoMiBodega.svg}" alt="Logo" width="40" class="me-2">
                <h5 class="offcanvas-title"><span>MiBodega</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>

            <div class="offcanvas-body">
                <!-- Información del usuario  -->
                <div class="user text-center">
                    <i class="bi bi-person-circle"></i>
                    <p class="mt-2">DANIEL HUAMANI</p>
                </div>

                <div class="nav flex-column">
                    <a th:href="@{/mibodega/dashboard}"><button class="btn btn-primary">DASHBOARD</button></a>
                    <a th:href="@{/mibodega/ventas}"><button class="btn btn-primary">VENTAS</button></a>
                    <a th:href="@{/mibodega/registro}"><button class="btn btn-dark">CARRITO DE COMPRAS</button></a>
                    <a th:href="@{/mibodega/inventario}"><button class="btn btn-primary">INVENTARIO</button></a>
                    <a th:href="@{/mibodega/cierre}"><button class="btn btn-primary">CIERRE DE CAJA</button></a>
                    <a th:href="@{/mibodega/configuracion}"><button class="btn btn-primary">CONFIGURACIÓN</button></a>
                    <a th:href="@{/mibodega/cerrarsesion}"><button class="btn btn-primary">CERRAR SESIÓN</button></a>
                </div>
            </div>
        </aside>


        <main class="content">
            <div class="ventas-header">
                <h5>REGISTRAR COMPRAS</h5>
            </div>

            <form id="formBuscarProducto" class="d-flex align-items-center gap-2 mt-3">
                <input id="busqueda-producto" type="text" class="form-control" placeholder="Nombre del producto...">                        
                <button type="submit" class="btn btn-success ms-4">
                    <i class="bi bi-search fs-5"></i>Buscar
                </button>
            </form>

            <button id="btnMostrarTodos" class="btn btn-success ms-4">Mostrar todos</button>

            <table id="tabla-resultados" class="table table-bordered">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Stock</th>
                        <th>Precio</th>
                        <th>Acción</th>                                
                    </tr>
                </thead>
                <tbody id="tbody-resultados">
                    <!-- Se llenará dinámicamente con JS -->
                </tbody>
            </table>

            <section class="cuadro">
                <h5>PRODUCTOS SELECCIONADOS</h5>
                <table>
                    <thead>
                        <tr>
                            <td>Nombre</td>
                            <td>Cantidad</td>
                            <td>Precio Unitario</td>
                            <td>Precio Total</td>
                            <td>Acción</td>
                        </tr>
                    </thead>
                    <tbody id="tbody-carrito">
                        <!-- Se llenará dinámicamente con JS -->
                    </tbody>
                </table>
            </section>

            <form id="formRegistroSimple">
                <button class="btn btn-volver">Registro simple</button>
            </form>
        </main>


        <footer class="footer py-3 text-center">
            <span> &copy; 2025 MiBodega. Todos los derechos reservados.</span>
        </footer>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
        <script src="/js/plantilla_MiBodega.js"></script>
        <script src="/js/miBodega_registro.js" type="text/javascript"></script>

    </body>
</html>
