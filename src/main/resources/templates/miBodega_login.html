<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicia Sesión en MiBodega</title>
        <link rel="stylesheet" href="/css/miBodega_login.css">
    </head>
    <body>
        <div class="login-container">
            <!-- Columna izquierda: Imagen -->
            <div class="image-column">
                <img th:src="@{/SVG/imagen_login.png}" alt="Imagen decorativa" />
            </div>

            <!-- Columna derecha: Login -->
            <div class="login-box">
                <h2 class="text-center">BIENVENIDO A MI BODEGA!</h2>
                <h2 class="text-center">Iniciar sesión</h2>
                <div class="text-center mb-4">
                    <img th:src="@{/SVG/LogoMiBodega.svg}" alt="Logo de MiBodega" style="max-width: 100%; height: auto; width: 150px;">
                </div>

                <form id="formLogin" class="form-post" 
                      method="post"
                      data-endpoint="/api/autenticacion/login">
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input name="correo" type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="contrasenia" class="form-label">Contraseña</label>
                        <input name="contrasenia" type="password" id="contrasenia" class="form-control" placeholder="Contraseña" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <input type="checkbox" id="remember">
                            <label for="remember">Recordarme</label>
                        </div>
                        <a href="#" class="text-muted">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success btn-ancho">Iniciar sesión</button>
                    </div>
                </form>

                <!--
                <div th:if="${param.error}">
                    <p style="color:red">Correo o contraseña incorrectos</p>
                </div>
                <div th:if="${param.logout}">
                    <p style="color:green">Sesión cerrada correctamente</p>
                </div>
                -->
            </div>
        </div>
        <script src="/js/formulario_jwt.js" type="text/javascript"></script>            
    </body>
</html>
